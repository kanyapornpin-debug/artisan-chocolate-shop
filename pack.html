<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบหยิบสินค้า & พิมพ์ใบปะหน้าพัสดุ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    /* ตั้งค่าการพิมพ์เฉพาะใบปะหน้าพัสดุ */
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100mm;
        height: 150mm;
        border: 2px solid #000;
        padding: 15px;
      }
    }
  </style>
</head>
<body class="bg-stone-100 p-6">

  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-stone-800">📦 ระบบจัดการคำสั่งซื้อและแพ็กสินค้า</h1>
      <button onclick="loadOrders()" class="bg-stone-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-stone-700">
        รีเฟรชข้อมูล
      </button>
    </div>

    <div id="loading" class="text-center py-10 text-stone-500">กำลังโหลดข้อมูลจาก Google Sheets...</div>

    <!-- รายการออเดอร์ -->
    <div id="orders-container" class="grid md:grid-cols-2 gap-4"></div>
  </div>

  <!-- พื้นที่ซ่อนสำหรับพิมพ์ใบปะหน้าพัสดุ (A6 Label) -->
  <div id="print-area" class="hidden bg-white text-black">
    <div class="border-b-2 border-black pb-2 mb-3">
      <p class="text-xs font-bold">ผู้ส่ง (SENDER):</p>
      <p class="text-sm font-semibold">CHOCO CRAFT THAILAND</p>
      <p class="text-xs">123 ถนนสุขุมวิท เขตวัฒนา กรุงเทพฯ 10110 (โทร. 02-000-0000)</p>
    </div>

    <div class="border-b-2 border-black pb-3 mb-3">
      <p class="text-xs font-bold">ผู้รับ (RECEIVER):</p>
      <p id="lbl-name" class="text-lg font-bold mt-1"></p>
      <p id="lbl-phone" class="text-base font-semibold"></p>
      <p id="lbl-address" class="text-sm mt-1 leading-relaxed"></p>
    </div>

    <div class="bg-stone-100 p-2 border border-black mb-3">
      <p class="text-xs font-bold mb-1">รายการสินค้าในกล่อง (PACKING LIST):</p>
      <div id="lbl-items" class="text-sm font-semibold"></div>
    </div>

    <div class="flex justify-between items-end text-xs pt-2">
      <div>
        <p>Order ID: <span id="lbl-id" class="font-bold"></span></p>
        <p>ยอดชำระ: ฿<span id="lbl-total"></span></p>
      </div>
      <div class="border border-black px-2 py-1 font-bold">
        ระวังสินค้าละลาย / เก็บในที่เย็น
      </div>
    </div>
  </div>

  <script>
    // *** นำ Web App URL เดียวกันจาก Google Apps Script มาวางที่นี่ ***
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxfMcpn2tI1U5nyIcAiZiq-A4cWe6jVxf4qwP2vPLabdHymDZqkHCaE2L4IOn5GMbh0zw/exec";
    let allOrders = [];

    async function loadOrders() {
      document.getElementById('loading').style.display = 'block';
      const container = document.getElementById('orders-container');
      container.innerHTML = '';

      try {
        const res = await fetch(SCRIPT_URL);
        allOrders = await res.json();
        document.getElementById('loading').style.display = 'none';

        allOrders.forEach((order, index) => {
          const card = document.createElement('div');
          card.className = "bg-white p-5 rounded-xl shadow-sm border border-stone-200 flex flex-col justify-between";
          
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-center border-b pb-2 mb-3">
                <span class="font-bold text-amber-900">${order.OrderID}</span>
                <span class="text-xs bg-amber-100 text-amber-900 px-2 py-1 rounded">${order.Status}</span>
              </div>
              
              <!-- ส่วนหยิบสินค้า (Pick List) -->
              <div class="bg-amber-50 p-3 rounded-lg mb-3 border border-amber-200">
                <p class="text-xs font-bold text-amber-900 mb-1">รายการที่ต้องหยิบลงกล่อง:</p>
                <ul class="text-sm space-y-1 font-semibold">
                  ${order.SKU1_Qty > 0 ? `<li>✅ [CHOC-DK70] Dark 70% : <span class="text-lg text-red-600">${order.SKU1_Qty}</span> แท่ง</li>` : ''}
                  ${order.SKU2_Qty > 0 ? `<li>✅ [CHOC-HZ45] Hazelnut Milk : <span class="text-lg text-red-600">${order.SKU2_Qty}</span> แท่ง</li>` : ''}
                </ul>
              </div>

              <!-- ข้อมูลจัดส่ง -->
              <div class="text-sm text-stone-700 space-y-1">
                <p><strong>ผู้รับ:</strong> ${order.CustomerName} (${order.Phone})</p>
                <p><strong>ที่อยู่:</strong> ${order.Address}</p>
                <p class="text-xs text-stone-500"><strong>หมายเหตุ:</strong> ${order.PaymentSlipURL}</p>
              </div>
            </div>

            <button onclick="printLabel(${index})" class="mt-4 w-full bg-stone-900 hover:bg-black text-white py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2">
              🖨️ พิมพ์ใบปะหน้าพัสดุ
            </button>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        document.getElementById('loading').innerText = "โหลดข้อมูลไม่สำเร็จ กรุณาตรวจสอบ URL";
      }
    }

    function printLabel(index) {
      const order = allOrders[index];
      document.getElementById('lbl-name').innerText = order.CustomerName;
      document.getElementById('lbl-phone').innerText = `โทร: ${order.Phone}`;
      document.getElementById('lbl-address').innerText = order.Address;
      document.getElementById('lbl-id').innerText = order.OrderID;
      document.getElementById('lbl-total').innerText = order.TotalPrice;

      let itemsHtml = "";
      if (order.SKU1_Qty > 0) itemsHtml += `<div>• Dark Chocolate 70% x ${order.SKU1_Qty} แท่ง</div>`;
      if (order.SKU2_Qty > 0) itemsHtml += `<div>• Roasted Hazelnut Milk x ${order.SKU2_Qty} แท่ง</div>`;
      document.getElementById('lbl-items').innerHTML = itemsHtml;

      const printArea = document.getElementById('print-area');
      printArea.classList.remove('hidden');
      window.print();
      printArea.classList.add('hidden');
    }

    loadOrders();
  </script>
</body>
</html>
